<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #fce4ec; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #d81b60; font-size: 3rem; margin-top: 50px; animation: bounce 2s infinite; }
        p { font-size: 1.2rem; color: #880e4f; }
        
        /* Photo Gallery */
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; max-width: 900px; margin: 40px auto; padding: 10px; }
        .gallery img { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; border: 5px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .gallery img:hover { transform: scale(1.05); }

        /* Simple Animation */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .footer { margin-top: 50px; color: #ad1457; font-weight: bold; }
    </style>
</head>
<body>

    <h1>✨ Happy Birthday, [Name]! ✨</h1>
    <p>Wishing you a day filled with love, laughter, and lots of cake! 🎂</p>

    <!-- Photo Gallery Section -->
    <div class="gallery">
        <!-- Replace the URLs below with your own photo links -->
        <img src="https://via.placeholder.com/300" alt="Memory 1">
        <img src="https://via.placeholder.com/300" alt="Memory 2">
        <img src="https://via.placeholder.com/300" alt="Memory 3">
        <img src="https://via.placeholder.com/300" alt="Memory 4">
    </div>

    <p class="footer">Made with ❤️ by [Your Name]</p>

</body>
</html>
